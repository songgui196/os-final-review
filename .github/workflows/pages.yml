name: Verify and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify knowledge base
        run: python3 tools/verify_knowledge_base.py
      - name: Build web content
        run: python3 tools/build_web_content.py
      - name: Verify theme behavior
        run: node tools/verify_theme.cjs
      - name: Verify web logic
        run: node tools/verify_web.cjs
      - name: Verify web flows
        run: node tools/verify_web_flow.cjs
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
